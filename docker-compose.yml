# Optional: run Qdrant with Docker instead of the native binary (Linux / macOS / Windows with Docker Desktop).
#   docker compose up -d
services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
