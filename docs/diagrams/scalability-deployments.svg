xt><rect x="550" y="70" width="420" height="50" rx="10" class="d-w"/><text x="760.0" y="98.5" text-anchor="middle" class="d-t" >GPU profile · 500,000 passages</text><text x="570" y="150" class="d-s" text-anchor="start">Hardware</text><text x="950" y="150" class="c-v" text-anchor="end">RTX 3050 6GB Laptop GPU</text><text x="570" y="176" class="d-s" text-anchor="start">Models</text><text x="950" y="176" class="c-v" text-anchor="end">fp16 on the GPU</text><text x="570" y="202" class="d-s" text-anchor="start">Reranker reads</text><text x="950" y="202" class="c-v" text-anchor="end">top 20</text><text x="570" y="228" class="d-s" text-anchor="start">Index build</text><text x="950" y="228" class="c-v" text-anchor="end">13.3 min on the GPU</text><text x="570" y="254" class="d-s" text-anchor="start">Qdrant RAM</text><text x="950" y="254" class="c-v" text-anchor="end">2.1 GB</text><text x="570" y="280" class="d-s" text-anchor="start">MRR@10, Phase 2</text><text x="950" y="280" class="c-v" text-anchor="end">0.513</text><text x="570" y="306" class="d-s" text-anchor="start">Gain over dense</text><text x="950" y="306" class="c-v" text-anchor="end">+0.062</text><text x="570" y="332" class="d-s" text-anchor="start">p95, Phase 2</text><text x="950" y="332" class="c-v" text-anchor="end">76 ms</text><text x="570" y="358" class="d-s" text-anchor="start">p95 with a filter</text><text x="950" y="358" class="c-v" text-anchor="end">81 ms</text><path d="M400,50 L240,60" class="d-ln" marker-end="url(#ah-scalability-deployments)"/><path d="M600,50 L760,60" class="d-ln" marker-end="url(#ah-scalability-deployments)"/></svg>