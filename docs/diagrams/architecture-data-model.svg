</style><defs><marker id="ah-architecture-data-model" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-ah"/></marker></defs><rect width="1000" height="230" class="d-bg"/><text x="20.0" y="26.0" text-anchor="start" class="d-m" >ONE QDRANT POINT = ONE PASSAGE</text><rect x="20" y="40" width="250" height="70" rx="10" class="d-a"/><text x="145.0" y="63.5" text-anchor="middle" class="d-t" >ID = UUID5(doc_id)</text><text x="145.0" y="80.5" text-anchor="middle" class="d-s" >same doc_id → same point</text><text x="145.0" y="95.5" text-anchor="middle" class="d-s" >an update overwrites, never duplicates</text><rect x="300" y="40" width="200" height="70" rx="10" class="d-box"/><text x="400.0" y="71.0" text-anchor="middle" class="d-t" >Vector &quot;dense&quot;</text><text x="400.0" y="88.0" text-anchor="middle" class="d-s" >384 floats · cosine · HNSW</text><rect x="530" y="40" width="200" height="70" rx="10" class="d-box"/><text x="630.0" y="71.0" text-anchor="middle" class="d-t" >Vector &quot;bm25&quot;</text><text x="630.0" y="88.0" text-anchor="middle" class="d-s" >sparse · IDF modifier</text><rect x="760" y="40" width="220" height="70" rx="10" class="d-box"/><text x="870.0" y="71.0" text-anchor="middle" class="d-t" >Payload</text><text x="870.0" y="88.0" text-anchor="middle" class="d-s" >text · version · updated_at</text><text x="20.0" y="146.0" text-anchor="start" class="d-m" >INDEXED PAYLOAD FIELDS (PRE-FILTER INSIDE THE SEARCH)</text><rect x="20" y="160" width="175" height="54" rx="10" class="d-g"/><text x="107.5" y="183.0" text-anchor="middle" class="d-t" >topic</text><text x="107.5" y="200.0" text-anchor="middle" class="d-s" >15 subjects</text><rect x="210" y="160" width="175" height="54" rx="10" class="d-g"/><text x="297.5" y="183.0" text-anchor="middle" class="d-t" >source_type</text><text x="297.5" y="200.0" text-anchor="middle" class="d-s" >8 kinds of website</text><rect x="400"