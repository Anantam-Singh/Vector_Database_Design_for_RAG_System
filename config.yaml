# PrecisionRAG configuration. Every tunable number lives here (rule FR-3: fusion must be documented and configurable).
# Paths can be overridden with environment variables in .env (see .env.example).

paths:
  hf_home: .cache/hf            # MS MARCO + sentence-transformers models   (env: HF_HOME)
  models_dir: .cache/models     # FastEmbed BM25 model                       (env: MODELS_DIR)
  eval_dir: eval                # frozen question sets (small, committed)
  results_dir: results          # every measurement, stamped (committed)
  changelog: data/changelog.sqlite   # history of every live insert/update/delete (local, not committed)

qdrant:
  url: http://127.0.0.1:6333    # never "localhost" on Windows: +2 s per call (IPv6 fallback)   (env: QDRANT_URL)
  collection: msmarco
  hnsw_m: 16
  hnsw_ef_construct: 100
  hnsw_ef_search: 128

models:
  dense: BAAI/bge-small-en-v1.5
  dense_dim: 384
  query_prefix: "Represent this sentence for searching relevant passages: "   # BGE instruction, queries only
  sparse: Qdrant/bm25
  bm25: {k: 1.2, b: 0.75, avg_len: 256.0}   # avg_len = average passage length in BM25 tokens (see Phase 3 doc)
  reranker: cross-encoder/ms-marco-MiniLM-L-6-v2

retrieval:
  top_k: 5
  prefetch_limit: 50            # candidates taken from each retriever (dense and BM25)
  rrf_k: 60
  fusion_hybrid: weighted_rrf   # rrf | weighted_rrf | linear
  weights_hybrid:        {dense: 1.0, bm25: 0.1}   # tuned on dev_large (1,000 q): best hybrid-only setting
  weights_hybrid_rerank: {dense: 1.0, bm25: 1.0}   # tuned on dev_large: more BM25 candidates help the reranker

# The code picks a profile automatically: "gpu" if CUDA is available, otherwise "cpu".
device: auto                    # auto | cuda | cpu
profiles:
  gpu: {corpus_size: 500000, embed_batch: 256, fp16: true,  rerank_depth: 20}
  cpu: {corpus_size: 100000, embed_batch: 32,  fp16: false, rerank_depth: 10}

# Which hardware profile each index uses when served by the API (the web UI's 100k / 500k switch).
# The 100k index runs the CPU profile (CPU models, rerank top-10) to show the system works without a GPU;
# the 500k index runs the GPU profile (rerank top-20). Set both to cuda to serve everything from the GPU.
serving:
  devices: {"100k": cpu, "500k": cuda}

index:
  upload_batch: 512
  chunk: 8192                   # passages embedded + uploaded per resumable step

eval:
  seed: 42
  dev_size: 200                 # tuning only
  dev_large_size: 1000          # tuning only (200 proved too noisy in Phase 3)
  test_size: 1000               # reporting only (label-based metrics)
  ragas_size: 50                # subset of test with a real human answer
  latency_queries: 100
  latency_warmup: 5

groq:
  judge_model: openai/gpt-oss-120b   # RAGAS judge — the SAME judge for every compared mode
  dev_model: openai/gpt-oss-20b      # test runs (separate free-tier quota)
  answer_model: qwen/qwen3.8-27b     # optional grounded answers (separate quota)
  min_remaining_requests: 50         # scripts stop safely before the daily quota runs out
