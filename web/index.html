<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrecisionRAG Metrics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-inner">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="2.5"/><circle cx="5" cy="6" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="5" cy="18" r="2"/><circle cx="19" cy="18" r="2"/><path d="M7 7l3 3.5M17 7l-3 3.5M7 17l3-3.5M17 17l-3-3.5"/></svg>
      </div>
      <span class="brand-name">PrecisionRAG <span>Metrics</span></span>
    </div>
    <nav class="tabs" id="tabs">
      <a href="#search" data-view="search">Search</a>
      <a href="#dense" data-view="dense">Phase 1: Dense</a>
      <a href="#hybrid" data-view="hybrid">Phase 2: Hybrid</a>
      <a href="#hybrid_rerank" data-view="hybrid_rerank">Phase 2: Hybrid + Reranker</a>
      <a href="#compare" data-view="compare">Comparison</a>
      <a href="#scale" data-view="scale">Scale: 100k vs 500k</a>
      <a href="#updates" data-view="updates">Live Updates</a>
    </nav>
    <div class="top-actions">
      <div class="seg small" id="index-switch" title="Which index live searches use"></div>
      <div class="status-pill" id="status"><span class="dot"></span><span>Connecting…</span></div>
      <button class="btn-dark" id="refresh" title="Reload status and measured results">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
        <span>Refresh</span>
      </button>
    </div>
  </div>
</header>

<main class="wrap main" id="view"></main>

<footer class="footer">
  <div class="wrap footer-inner">
    <span>PrecisionRAG · Team OutLiers · ADROSONIC BUILD — PS1</span>
    <span id="footer-info">Qdrant (local) · MS MARCO v1.1</span>
  </div>
</footer>
<script src="app.js"></script>
</body>
</html>
